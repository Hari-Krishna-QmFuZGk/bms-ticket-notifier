name: Tests
on:
  pull_request:
  push:
    paths: ['**.py', 'pyproject.toml', 'uv.lock', '.github/workflows/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync python -m unittest discover -v
